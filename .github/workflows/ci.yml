name: CI

# No `paths:` filter, deliberately. `vet / test / lint` is a required check on
# main, and a required check that is path-filtered never reports on a PR that
# misses the filter — branch protection then blocks that PR forever. Any
# docs-only or LICENSE-only change hit that wall.
#
# The usual workaround, a second workflow with the same job name under
# `paths-ignore`, is worse: a PR touching Go *and* docs matches both, so two
# check runs publish the same context. If the real run fails and the stub
# passes after it, protection is satisfied with failing tests. Running the job
# unconditionally costs a couple of runner-minutes on doc PRs and cannot lie.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: vet / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Lint
        run: go tool golangci-lint run ./...
